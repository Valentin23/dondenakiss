<nav aria-label="Idioma" i18n-aria-label="@@langSwitcher.label">
  @if (variant() === 'dropdown') {
    <button
      #trigger
      type="button"
      class="trigger"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-controls]="menuId"
      (click)="toggleMenu()"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
      </svg>
      <span class="visually-hidden" i18n="@@langSwitcher.change">Cambiar idioma, actual:</span>
      <span>{{ currentLocale.toUpperCase() }}</span>
      <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M3 4.5l3 3 3-3" />
      </svg>
    </button>
    <ul class="menu" [id]="menuId" [hidden]="!menuOpen()">
      @for (link of links(); track link.locale) {
        <li>
          <a
            [href]="link.href"
            [attr.hreflang]="link.locale"
            [attr.lang]="link.locale"
            [attr.aria-current]="link.current ? 'true' : null"
          >
            <span>{{ link.name }}</span>
            <span class="code" aria-hidden="true">{{ link.locale.toUpperCase() }}</span>
          </a>
        </li>
      }
    </ul>
  } @else {
    <ul class="inline">
      @for (link of links(); track link.locale) {
        <li>
          <a
            [href]="link.href"
            [attr.hreflang]="link.locale"
            [attr.lang]="link.locale"
            [attr.aria-current]="link.current ? 'true' : null"
            >{{ link.locale.toUpperCase() }}<span class="visually-hidden"> {{ link.name }}</span></a
          >
        </li>
      }
    </ul>
  }
</nav>
